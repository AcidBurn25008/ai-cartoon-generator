<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cartoon Video Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
        }
        button {
            margin-top: 15px;
            padding: 12px 20px;
            font-size: 16px;
            color: #fff;
            background: #ff9800;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #e68900;
        }
        #status {
            margin-top: 15px;
            font-size: 16px;
            color: #fff;
        }
        .logo {
            width: 100px;
            margin-bottom: 10px;
        }
        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/JavaScript-logo.png/200px-JavaScript-logo.png" alt="AI Logo" class="logo">
        <h1><i class="fas fa-video icon"></i> AI Cartoon Video Generator</h1>
        <p>Enter your text script below and generate a cartoon video instantly.</p>
        <textarea id="scriptInput" placeholder="Enter your script here..."></textarea><br>
        <button onclick="generateVideo()"><i class="fas fa-magic"></i> Generate Cartoon Video</button>
        <p id="status"></p>
    </div>
    <script>
        async function generateVideo() {
            const script = document.getElementById("scriptInput").value;
            if (script.trim() === "") {
                alert("Please enter a script.");
                return;
            }

            document.getElementById("status").innerText = "Generating video... Please wait.";

            try {
                const response = await fetch("https://api.runwayml.com/v1/text_to_video", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer YOUR_API_KEY",
                        "X-Runway-Version": "2024-11-06"
                    },
                    body: JSON.stringify({
                        prompt: script
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                const videoUrl = data.result; // Adjust based on actual API response

                document.getElementById("status").innerHTML = `
                    ✅ Video generated! <br>
                    <a href="${videoUrl}" target="_blank">Watch your video</a>
                `;
            } catch (error) {
                document.getElementById("status").innerText = "❌ Error generating video.";
                console.error("Error:", error);
            }
        }
    </script>
</body>
</html>
